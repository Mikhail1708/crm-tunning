version: '3.8'

services:
  db:
    image: postgres:15
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in the environment}
      SITE_WEBHOOK_URL: ${SITE_WEBHOOK_URL:?Set SITE_WEBHOOK_URL in the environment}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in the environment}
      CRM_STATUS_OUTBOX_POLL_MS: ${CRM_STATUS_OUTBOX_POLL_MS:-1000}
      CRM_STATUS_OUTBOX_STALE_MS: ${CRM_STATUS_OUTBOX_STALE_MS:-60000}
      CRM_STATUS_OUTBOX_RETRY_BASE_MS: ${CRM_STATUS_OUTBOX_RETRY_BASE_MS:-1000}
      CRM_STATUS_OUTBOX_RETRY_MAX_MS: ${CRM_STATUS_OUTBOX_RETRY_MAX_MS:-900000}
      PORT: 5000
      BASE_URL: https://swapcrm38.ru
      COOKIE_DOMAIN: .swapcrm38.ru
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - crm-network

  frontend:
    build: ./frontend
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - crm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - crm-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in the environment}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - crm-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - crm-network

volumes:
  postgres_data:
  backend_uploads:
  prometheus_data:
  grafana_data:

networks:
  crm-network:
    driver: bridge
